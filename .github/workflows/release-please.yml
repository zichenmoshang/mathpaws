name: Release & Deploy

# release-please：根据 Conventional Commits 自动生成发布 PR；
# 合并发布 PR → 自动打 tag + GitHub Release + 部署 demo 站。
# 注意：release-please 用 GITHUB_TOKEN 打的 tag 不会级联触发其他
# workflow，因此部署 job 必须放在本 workflow 内（deploy.yml 仅手动兜底）。
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: release-deploy
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      # 版本策略由 release-please-config.json + .release-please-manifest.json 驱动
      # （首发已出 1.0.0；之后 feat: → minor、fix: → patch 自动递增）
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          target-branch: main

  deploy:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 项目站点地址为 https://<owner>.github.io/<repo>/，资源需带 /<repo>/ 前缀
      - name: Build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: pnpm --filter mathpaws-client build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

      - id: deployment
        uses: actions/deploy-pages@v4

      # 部署后冒烟：直打线上 Pages 地址（E2E_BASE_URL，不起本地 preview），
      # 作为 PR 门禁之外的部署层兜底；失败使本 workflow 变红以便及时发现
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - run: corepack pnpm --filter mathpaws-client exec playwright install --with-deps chromium

      - name: Post-deploy smoke
        env:
          E2E_BASE_URL: ${{ steps.deployment.outputs.page_url }}
        run: corepack pnpm --filter mathpaws-client exec playwright test

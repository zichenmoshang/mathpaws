name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      # 覆盖率基线报告（仅打标，不设门槛；失败仍视为测试失败）
      - run: corepack pnpm --filter mathpaws-client test:coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: apps/web/coverage
          if-no-files-found: ignore
          retention-days: 7

      - run: pnpm build

      # 浏览器二进制按 lockfile 缓存，命中后 install 秒级完成
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      # E2E 冒烟：preview 依赖上一步 build 产物
      - run: corepack pnpm --filter mathpaws-client exec playwright install --with-deps chromium

      - run: corepack pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-artifacts
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7
